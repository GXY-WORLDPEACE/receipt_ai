<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Receipt AI</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 24px; }
    .card { max-width: 860px; padding: 16px; border: 1px solid #ddd; border-radius: 12px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    button { padding: 10px 14px; border-radius: 10px; border: 1px solid #333; background: #111; color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    input[type="file"] { padding: 8px; }
    pre { white-space: pre-wrap; word-break: break-word; background: #f7f7f7; padding: 12px; border-radius: 10px; overflow: auto; }
    .muted { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Receipt AI (OCR + DeepSeek)</h2>
    <p class="muted">上传小票图片 → 自动解析商品/金额/分类 → 输出 JSON</p>

    <div class="row">
      <input id="file" type="file" accept="image/*" />
      <label>
        货币：
        <input id="currency" value="EUR" style="width:80px; padding:6px;" />
      </label>
      <label>
        Debug：
        <input id="debug" type="checkbox" />
      </label>
      <button id="btn" onclick="run()">开始解析</button>
    </div>

    <p id="status" class="muted"></p>
    <pre id="out">{}</pre>
  </div>

<script>
async function run() {
  const fileInput = document.getElementById('file');
  const btn = document.getElementById('btn');
  const out = document.getElementById('out');
  const status = document.getElementById('status');
  const currency = document.getElementById('currency').value || 'EUR';
  const debug = document.getElementById('debug').checked;

  if (!fileInput.files || fileInput.files.length === 0) {
    alert('请选择一张图片');
    return;
  }

  btn.disabled = true;
  status.textContent = '上传并解析中...（首次运行 OCR 可能会慢一点）';
  out.textContent = '{}';

  try {
    const fd = new FormData();
    fd.append('file', fileInput.files[0]);

    const url = `/v1/receipt/parse?currency=${encodeURIComponent(currency)}&debug=${debug ? '1' : '0'}`;
    const resp = await fetch(url, { method: 'POST', body: fd });

    const text = await resp.text();
    if (!resp.ok) {
      status.textContent = `请求失败：HTTP ${resp.status}`;
      out.textContent = text;
      return;
    }

    status.textContent = '解析完成 ✅';
    try {
      out.textContent = JSON.stringify(JSON.parse(text), null, 2);
    } catch {
      out.textContent = text;
    }
  } catch (e) {
    status.textContent = '请求异常';
    out.textContent = String(e);
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
